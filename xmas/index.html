<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1d3a">
<title>A little something for you 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d62839; --red-d:#a81a2a; --gold:#ffc93c; --green:#1f8a5b; --ink:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #28508a 0%, transparent 60%),
      linear-gradient(#0b1d3a 0%, #14325c 55%, #1d4a6e 100%);
    min-height:100svh; overflow-x:hidden; overflow-y:auto;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #snow{z-index:1} #confetti{z-index:50}

  /* stars */
  .star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.2;
    animation:twinkle 3s ease-in-out infinite;z-index:0}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.3)}}

  /* string lights */
  #lights{position:fixed;top:0;left:0;width:100%;height:70px;z-index:3;pointer-events:none}
  #lights .wire{fill:none;stroke:#0a0f1c;stroke-width:2.5}
  #lights circle{animation:glow 1.8s ease-in-out infinite;filter:drop-shadow(0 0 7px currentColor)}
  .c0{fill:#ff4d5e;color:#ff4d5e}.c1{fill:#ffd23f;color:#ffd23f}
  .c2{fill:#3ddc97;color:#3ddc97}.c3{fill:#58b4ff;color:#58b4ff}
  @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}

  /* hills + trees */
  #ground{position:fixed;left:0;bottom:0;width:100%;height:20vh;min-height:110px;z-index:2;pointer-events:none}

  main{
    position:relative;z-index:5;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:80px 22px 130px;gap:6px;
  }
  h1{
    font-family:'Mountains of Christmas',cursive;font-weight:700;
    font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;
    text-shadow:0 0 22px rgba(255,201,60,.55),0 3px 0 rgba(0,0,0,.25);
    animation:pop 900ms cubic-bezier(.2,1.4,.4,1) both;
  }
  h1 span{display:inline-block;animation:bob 3s ease-in-out infinite}
  h1 span:nth-child(2){animation-delay:.3s}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .sub{font-size:clamp(1.02rem,4.2vw,1.2rem);font-weight:600;opacity:.92;max-width:26em;
    margin-top:6px;min-height:3.2em;animation:pop 900ms 200ms cubic-bezier(.2,1.4,.4,1) both}

  /* gift */
  .giftwrap{margin:6px 0 10px;animation:float 4s ease-in-out infinite;position:relative}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
  svg.gift{width:clamp(190px,58vw,270px);height:auto;overflow:visible;display:block}
  .gift .lid,.gift .elf,.gift .glow{transition:transform .9s cubic-bezier(.2,1.2,.3,1),opacity .6s}
  .gift .lid{transform-box:fill-box;transform-origin:center}
  .gift .glow{opacity:0;transform-origin:100px 110px}
  .giftwrap.shake{animation:shake .6s ease-in-out infinite}
  @keyframes shake{
    0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) translateX(-4px)}
    30%{transform:rotate(6deg) translateX(4px)}45%{transform:rotate(-5deg)}
    60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
  .giftwrap.open{animation:none}
  .open .lid{transform:translate(46px,-92px) rotate(26deg);opacity:0;transition:transform 1s cubic-bezier(.2,1,.3,1),opacity .9s .25s}
  .open .elf{transform:translateY(-78px)}
  .elfinner{transform-origin:100px 185px}
  .open .elfinner{animation:elfwiggle 1.3s 1s ease-in-out infinite}
  @keyframes elfwiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .armL,.armR{transform-box:view-box}
  .armL{transform-origin:82px 156px}.armR{transform-origin:118px 156px}
  .open .armR{animation:wave .6s 1s ease-in-out infinite}
  .open .armL{animation:wave .6s 1.3s ease-in-out infinite reverse}
  @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
  .open .glow{opacity:1;transform:scale(1.15)}

  /* button */
  .btn{
    position:relative;overflow:hidden;cursor:pointer;
    font:800 1.2rem/1 'Nunito',system-ui,sans-serif;color:#fff;letter-spacing:.3px;
    padding:18px 34px;border-radius:999px;border:3px solid #fff;
    background:linear-gradient(#ee3a4b,var(--red-d));
    box-shadow:0 8px 0 #7a1220,0 14px 28px rgba(0,0,0,.35);
    text-shadow:0 2px 0 rgba(0,0,0,.3);
    transition:transform .12s,box-shadow .12s,opacity .3s;
    animation:pulse 2.2s ease-in-out infinite;
  }
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
  @keyframes shine{0%{left:-60%}55%,100%{left:130%}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .btn:active{transform:translateY(6px) scale(.98);box-shadow:0 2px 0 #7a1220,0 6px 14px rgba(0,0,0,.35);animation:none}
  .btn:disabled{cursor:default;opacity:.85;animation:none}
  .btn:focus-visible{outline:4px solid var(--gold);outline-offset:4px}

  .note{margin-top:16px;font-size:.95rem;font-weight:600;opacity:.9;min-height:1.4em}
  .note.err{color:#ffb4bc;opacity:1}
  .done{
    margin-top:8px;padding:16px 22px;border-radius:22px;max-width:24em;
    background:rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:2px dashed rgba(255,255,255,.55);font-weight:800;font-size:1.1rem;line-height:1.35;
    animation:pop .8s cubic-bezier(.2,1.4,.4,1) both;
  }
  .done small{display:block;font-weight:600;opacity:.85;margin-top:6px;font-size:.88rem}
  [hidden]{display:none!important}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .btn::after{display:none}
  }
</style>
</head>
<body>

<svg id="lights" aria-hidden="true"></svg>
<div id="stars" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<svg id="ground" viewBox="0 0 400 100" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 55 Q70 25 150 52 T310 46 T400 50 V100 H0Z" fill="#dfe9f5"/>
  <path d="M0 72 Q100 48 200 70 T400 64 V100 H0Z" fill="#fff"/>
</svg>

<main>
  <h1 id="title"><span>Merry</span> <span id="xmas">Christmas</span> <span id="nameBit"></span></h1>
  <p class="sub" id="sub">I got you something. Tap the button to unwrap it. 🎁</p>

  <div class="giftwrap" id="giftwrap">
    <svg class="gift" viewBox="0 0 200 220" role="img" aria-label="A wrapped Christmas present">
      <defs>
        <radialGradient id="gl" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff6c2" stop-opacity=".95"/>
          <stop offset=".5" stop-color="#ffc93c" stop-opacity=".45"/>
          <stop offset="1" stop-color="#ffc93c" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bodyg" x1="0" x2="1">
          <stop offset="0" stop-color="#e23446"/><stop offset="1" stop-color="#b51c2c"/>
        </linearGradient>
        <linearGradient id="ribg" x1="0" x2="1">
          <stop offset="0" stop-color="#ffd966"/><stop offset="1" stop-color="#f0b429"/>
        </linearGradient>
      </defs>
      <ellipse cx="100" cy="206" rx="78" ry="9" fill="rgba(0,0,0,.28)"/>
      <circle class="glow" cx="100" cy="110" r="100" fill="url(#gl)"/>
      <!-- elf (hidden behind box until open) -->
      <g class="elf"><g class="elfinner">
        <!-- ears -->
        <path d="M83 126 L64 117 L84 138Z" fill="#ffd2b0"/><path d="M117 126 L136 117 L116 138Z" fill="#ffd2b0"/>
        <!-- left arm -->
        <g class="armL"><path d="M82 156 L64 134" stroke="#1f8a5b" stroke-width="10" stroke-linecap="round"/><circle cx="62" cy="130" r="5.5" fill="#ffd2b0"/></g>
        <!-- right arm -->
        <g class="armR"><path d="M118 156 L136 134" stroke="#1f8a5b" stroke-width="10" stroke-linecap="round"/><circle cx="138" cy="130" r="5.5" fill="#ffd2b0"/></g>
        <!-- tunic -->
        <path d="M80 152 Q100 143 120 152 L125 192 H75Z" fill="#1f8a5b"/>
        <path d="M86 150 L100 162 L114 150Z" fill="#fff"/>
        <rect x="77" y="172" width="46" height="7" fill="#3a2a1a"/><rect x="95" y="170" width="10" height="11" rx="2" fill="#ffc93c"/>
        <!-- face -->
        <circle cx="100" cy="128" r="19" fill="#ffd2b0"/>
        <circle cx="93" cy="126" r="2.4" fill="#2b1b17"/><circle cx="107" cy="126" r="2.4" fill="#2b1b17"/>
        <circle cx="87" cy="134" r="3.6" fill="#ff8a95" opacity=".65"/><circle cx="113" cy="134" r="3.6" fill="#ff8a95" opacity=".65"/>
        <path d="M92 134 Q100 144 108 134" stroke="#2b1b17" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <!-- hat -->
        <path d="M79 114 Q86 82 120 72 Q106 92 121 114Z" fill="#e63946"/>
        <rect x="77" y="108" width="46" height="9" rx="4.5" fill="#fff"/>
        <circle cx="121" cy="72" r="6.5" fill="#fff"/>
      </g></g>
      <!-- body -->
      <rect x="30" y="98" width="140" height="102" rx="8" fill="url(#bodyg)"/>
      <rect x="38" y="106" width="14" height="86" rx="6" fill="#fff" opacity=".13"/>
      <rect x="88" y="98" width="24" height="102" fill="url(#ribg)"/>
      <!-- lid -->
      <g class="lid">
        <rect x="20" y="62" width="160" height="38" rx="8" fill="#ee3a4b"/>
        <rect x="28" y="68" width="14" height="24" rx="6" fill="#fff" opacity=".15"/>
        <rect x="88" y="62" width="24" height="38" fill="url(#ribg)"/>
        <ellipse cx="80" cy="52" rx="23" ry="12" transform="rotate(-24 80 52)" fill="url(#ribg)" stroke="#d99a00" stroke-width="2"/>
        <ellipse cx="120" cy="52" rx="23" ry="12" transform="rotate(24 120 52)" fill="url(#ribg)" stroke="#d99a00" stroke-width="2"/>
        <circle cx="100" cy="58" r="9" fill="#ffd966" stroke="#d99a00" stroke-width="2"/>
      </g>
    </svg>
  </div>

  <button class="btn" id="btn" type="button">Redeem my gift 🎁</button>
  <p class="note" id="note" aria-live="polite"></p>

  <div class="done" id="done" hidden aria-live="polite"></div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>
<noscript><p style="position:fixed;bottom:10px;left:0;right:0;text-align:center;z-index:99">This page needs JavaScript to work 🎄</p></noscript>

<script>
/* ============ EDIT THESE ============ */
const CONFIG = {
  webhookUrl: "https://script.google.com/macros/s/AKfycbzwPFTasLZg03_5noWcG4idt71tAZVND09O7-ywYpBXWSwwKkigP5G8HuZf_oxq-tS0/exec", // the Web app URL from Google Apps Script
  name: "Bebé",                                  // e.g. "Sam" → "Merry Christmas, Sam!" (leave "" to skip)
  from: "",                                      // e.g. "Alex" → shows "Love, Alex" after redeeming
  intro: "I got you something. Tap the button to unwrap it. 🎁"
};
/* ==================================== */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEMO = CONFIG.webhookUrl.includes("PASTE_");
const KEY = "xmas-voucher-redeemed";
const store = {
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } },
  set(){ try{ localStorage.setItem(KEY,"1"); }catch(e){} },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};
if (location.search.includes("reset")) store.clear();

$("sub").textContent = CONFIG.intro;
if (CONFIG.name){ $("xmas").textContent = "Christmas,"; $("nameBit").textContent = CONFIG.name + "!"; }

/* ---------- stars ---------- */
(() => {
  const w = $("stars");
  for (let i=0;i<45;i++){
    const s = document.createElement("i"); s.className="star";
    s.style.left = Math.random()*100+"%"; s.style.top = Math.random()*65+"%";
    s.style.animationDelay = (Math.random()*3)+"s";
    s.style.animationDuration = (2+Math.random()*3)+"s";
    w.appendChild(s);
  }
})();

/* ---------- string lights ---------- */
function drawLights(){
  const svg = $("lights"), W = innerWidth, H = 70;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const step = 44, n = Math.ceil(W/step)+1;
  let d = `M-10 8`, bulbs = "";
  for (let i=0;i<n;i++){
    const x0 = i*step-10, x1 = x0+step;
    d += ` Q${x0+step/2} ${46} ${x1} 8`;
    const bx = x0+step/2, by = 33;
    bulbs += `<g><rect x="${bx-3}" y="${by-14}" width="6" height="8" fill="#0a0f1c"/>`+
             `<circle class="c${i%4}" cx="${bx}" cy="${by}" r="7" style="animation-delay:${(i%4)*.45}s"/></g>`;
  }
  svg.innerHTML = `<path class="wire" d="${d}"/>${bulbs}`;
}
drawLights(); addEventListener("resize", drawLights);

/* ---------- canvases ---------- */
const dpr = Math.min(devicePixelRatio||1, 2);
function fit(c){ c.width = innerWidth*dpr; c.height = innerHeight*dpr; c.getContext("2d").setTransform(dpr,0,0,dpr,0,0); }
const snow = $("snow"), conf = $("confetti");
fit(snow); fit(conf);
addEventListener("resize", ()=>{ fit(snow); fit(conf); });

/* ---------- snow ---------- */
const sctx = snow.getContext("2d");
const flakes = [];
const FLAKES = reduce ? 0 : (innerWidth < 600 ? 70 : 140);
for (let i=0;i<FLAKES;i++) flakes.push({
  x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  r:1+Math.random()*3, v:.5+Math.random()*1.2, p:Math.random()*6.28, a:.4+Math.random()*.6
});
function snowLoop(){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  for (const f of flakes){
    f.y += f.v; f.p += .01; f.x += Math.sin(f.p)*.6;
    if (f.y>innerHeight+5){ f.y=-5; f.x=Math.random()*innerWidth; }
    sctx.beginPath(); sctx.globalAlpha=f.a; sctx.fillStyle="#fff";
    sctx.arc(f.x,f.y,f.r,0,6.283); sctx.fill();
  }
  sctx.globalAlpha=1;
  requestAnimationFrame(snowLoop);
}
if (FLAKES) snowLoop();

/* ---------- confetti ---------- */
const cctx = conf.getContext("2d"), parts = []; let running = false;
const COLORS = ["#ff4d5e","#ffd23f","#3ddc97","#58b4ff","#ffffff","#ff9ec7"];
function burst(){
  const r = $("giftwrap").getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height*.35;
  const n = reduce ? 30 : 170;
  for (let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.25, sp = 6+Math.random()*10;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:6+Math.random()*7,
      rot:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:COLORS[i%COLORS.length],round:Math.random()<.3});
  }
  if (!running){ running=true; confLoop(); }
}
function confLoop(){
  cctx.clearRect(0,0,innerWidth,innerHeight);
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.vy += .28; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.y > innerHeight+30){ parts.splice(i,1); continue; }
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot); cctx.fillStyle=p.c;
    if (p.round){ cctx.beginPath(); cctx.arc(0,0,p.s/2,0,6.283); cctx.fill(); }
    else cctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cctx.restore();
  }
  if (parts.length) requestAnimationFrame(confLoop); else { running=false; cctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---------- redeem flow ---------- */
const wait = ms => new Promise(r=>setTimeout(r,ms));

async function sendRequest(){
  if (DEMO){ await wait(500); return {status:"sent"}; }   // preview mode, nothing is sent
  const res = await fetch(CONFIG.webhookUrl, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({action:"redeem"})
  });
  return await res.json();
}

function showDone(){
  $("btn").hidden = true; $("note").textContent = "";
  $("sub").textContent = "Surprise! It's yours 🎉";
  const who = CONFIG.from ? `<small>Love, ${CONFIG.from} ❤️</small>` : "";
  $("done").innerHTML = "Check your email inbox 📬" +
    `<small>(If you can't see it, peek in your spam folder.)</small>` + who;
  $("done").hidden = false;
}

async function redeem(){
  const btn = $("btn"), gw = $("giftwrap"), note = $("note");
  btn.disabled = true; btn.textContent = "Unwrapping…"; note.textContent = ""; note.classList.remove("err");
  gw.classList.add("shake");
  let result;
  try { [result] = await Promise.all([sendRequest(), wait(1300)]); }
  catch(e){ result = {status:"error"}; }
  gw.classList.remove("shake");

  if (result && (result.status==="sent" || result.status==="already")){
    gw.classList.add("open"); burst(); setTimeout(burst, 450);
    setTimeout(showDone, 900);
  } else {
    btn.disabled = false; btn.textContent = "Try again 🎁";
    note.classList.add("err");
    note.textContent = "Oh no, the elves dropped it! Try once more, or message me 💬";
  }
}
$("btn").addEventListener("click", redeem);

</script>
</body>
</html>
